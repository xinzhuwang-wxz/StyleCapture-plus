name: StyleCaptureJourney
options:
  bundleIdPrefix: com.stylecapture
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
packages:
  swift-composable-architecture:
    url: https://github.com/pointfreeco/swift-composable-architecture.git
    exactVersion: 1.26.1
  swift-case-paths:
    url: https://github.com/pointfreeco/swift-case-paths
    exactVersion: 1.9.1
  swift-clocks:
    url: https://github.com/pointfreeco/swift-clocks
    exactVersion: 1.1.0
  swift-dependencies:
    url: https://github.com/pointfreeco/swift-dependencies
    exactVersion: 1.14.1
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: 7.11.1
  Nuke:
    url: https://github.com/kean/Nuke.git
    exactVersion: 13.0.6
  swift-openapi-generator:
    url: https://github.com/apple/swift-openapi-generator.git
    exactVersion: 1.13.0
  swift-openapi-runtime:
    url: https://github.com/apple/swift-openapi-runtime.git
    exactVersion: 1.11.0
  swift-openapi-urlsession:
    url: https://github.com/apple/swift-openapi-urlsession.git
    exactVersion: 1.1.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
targets:
  StyleCaptureAPI:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OpenAPI
      - path: StyleCaptureAPI
    dependencies:
      - package: swift-openapi-runtime
        product: OpenAPIRuntime
      - package: swift-openapi-urlsession
        product: OpenAPIURLSession
    buildToolPlugins:
      - plugin: OpenAPIGenerator
        package: swift-openapi-generator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stylecapture.journey.api
        GENERATE_INFOPLIST_FILE: YES
  StyleCaptureJourney:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: StyleCaptureJourney
    dependencies:
      - target: StyleCaptureAPI
      - package: swift-composable-architecture
        product: ComposableArchitecture
      - package: swift-case-paths
        product: CasePaths
      - package: swift-dependencies
        product: Dependencies
      - package: GRDB
        product: GRDB
      - package: Nuke
        product: Nuke
      - sdk: MetricKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stylecapture.journey
        PRODUCT_NAME: StyleCaptureJourney
        INFOPLIST_FILE: StyleCaptureJourney/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
  StyleCaptureJourneyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: StyleCaptureJourneyTests
    dependencies:
      - target: StyleCaptureJourney
      - package: swift-composable-architecture
        product: ComposableArchitecture
      - package: swift-case-paths
        product: CasePaths
      - package: swift-clocks
        product: Clocks
      - package: swift-dependencies
        product: Dependencies
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stylecapture.journey.tests
        GENERATE_INFOPLIST_FILE: YES
  StyleCaptureJourneyUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: StyleCaptureJourneyUITests
    dependencies:
      - target: StyleCaptureJourney
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stylecapture.journey.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  StyleCaptureJourney:
    shared: true
    build:
      targets:
        StyleCaptureJourney: all
        StyleCaptureJourneyTests: [test]
        StyleCaptureJourneyUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - StyleCaptureJourneyTests
        - StyleCaptureJourneyUITests
    run:
      config: Debug
    archive:
      config: Release
