limit_conn_zone $binary_remote_addr zone=stylecapture_upload_connections:1m;
limit_req_zone $binary_remote_addr zone=stylecapture_upload_rate:1m rate=30r/m;

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_upstream api:8000;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        proxy_pass http://$api_upstream/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/ {
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }

    # Upload credentials travel in X-Upload-Token, never in the URL. Suppress
    # raw upload access logging as an additional privacy boundary.
    location = /v1/uploads {
        access_log off;
        limit_conn stylecapture_upload_connections 2;
        limit_req zone=stylecapture_upload_rate burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }

    location /v1/uploads/ {
        access_log off;
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
