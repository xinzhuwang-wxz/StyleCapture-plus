server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;

    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_upstream api:8000;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        proxy_pass http://$api_upstream/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /readyz {
        proxy_pass http://$api_upstream/readyz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        proxy_pass http://$api_upstream/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /docs {
        proxy_pass http://$api_upstream/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /redoc {
        proxy_pass http://$api_upstream/redoc;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI is shipped with the H5 image so API documentation remains
    # usable on judging networks that cannot reach overseas CDNs.
    location ^~ /docs-assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ^~ /downloads/ {
        add_header Cache-Control "public, max-age=3600" always;
        add_header Content-Disposition "attachment" always;
        try_files $uri =404;
    }

    location /v1/ {
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }

    # Upload credentials travel in X-Upload-Token, never in the URL. Suppress
    # raw upload access logging as an additional privacy boundary.
    location = /v1/uploads {
        access_log off;
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }

    location /v1/uploads/ {
        access_log off;
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }

    # The manifest changes only with a release. Revalidate after five minutes,
    # but allow an already-open judging session to keep rendering during a
    # transient network wobble.
    location = /feed/manifest.json {
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=1800" always;
        try_files $uri =404;
    }

    # Lightweight first-frame previews make Feed immediately visible while the
    # active MP4 range is still arriving on a mobile connection.
    location ^~ /feed/posters/ {
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=2592000" always;
        try_files $uri =404;
    }

    # Feed 素材在同一发布版本内保持稳定。让浏览器复用已看过的视频，
    # 避免返回上一条或刷新页面时再次占用有限的公网出口。
    location ^~ /feed/media/ {
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=2592000" always;
        try_files $uri =404;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
