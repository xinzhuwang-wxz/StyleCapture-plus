<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf5ff" />
    <link rel="preload" href="/feed/manifest.json" as="fetch" crossorigin="anonymous" />
    <!--
      标题与按钮用的圆体。Google Fonts 按 unicode-range 切片下发，只会拉到本页
      实际用到的字，不会为了几个标题下载整套中文。取不到时回落到系统字体，
      版式不变——见 pixel-theme.css 的 --font-pixel。
      注意：fonts.googleapis.com 在中国大陆访问不到，届时全站会是回落字体。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap"
    />
    <title>码上搭</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
