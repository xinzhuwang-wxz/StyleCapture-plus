name: stylecapture

services:
  api:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    command:
      - sh
      - -c
      - >-
        python -m stylecapture_backend.manage migrate &&
        uvicorn stylecapture_backend.entrypoint:build_app
        --factory --host 0.0.0.0 --port 8000
    environment:
      STYLECAPTURE_CORS_ORIGINS: '["http://localhost:5173"]'
      STYLECAPTURE_DATABASE_URL: postgresql+asyncpg://stylecapture:stylecapture@postgres:5432/stylecapture
      STYLECAPTURE_REDIS_URL: redis://redis:6379/0
      STYLECAPTURE_UPLOAD_ROOT: /data/uploads
      STYLECAPTURE_UPLOAD_SIGNING_SECRET: ${STYLECAPTURE_UPLOAD_SIGNING_SECRET:-local-compose-signing-secret-change-before-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - stylecapture-uploads:/data/uploads
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: stylecapture
      POSTGRES_PASSWORD: stylecapture
      POSTGRES_USER: stylecapture
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stylecapture -d stylecapture"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - stylecapture-postgres:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "192mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - stylecapture-redis:/data
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  stylecapture-postgres:
  stylecapture-redis:
  stylecapture-uploads:
