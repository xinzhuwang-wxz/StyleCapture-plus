[project]
name = "stylecapture-workspace"
version = "0.1.0"
description = "StyleCapture-plus product workspace"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false
# cryptography 47+ 的 aarch64 wheel 里，Rust 扩展会执行一条 Docker Desktop 的
# linux/arm64 虚拟机不支持的指令；结果是 litellm 网关一 import 就 SIGILL 退出
# （exit 132），worker 因此永远起不来。46.x 是同时能在 arm64 与 x86_64 上启动
# 的最后一个版本。
constraint-dependencies = ["cryptography<47"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.workspace]
members = ["services/backend"]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.14,<2",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
pythonpath = ["services/backend/src"]
testpaths = ["services/backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["_ref", "node_modules", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
exclude = "(_ref/|node_modules/|\\.venv/)"

[[tool.mypy.overrides]]
module = ["pillow_heif", "pillow_heif.*"]
ignore_missing_imports = true
